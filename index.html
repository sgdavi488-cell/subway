<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#071b18"><title>Brasil Rush 3D</title><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=DM+Sans:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071b18;color:#fff;font-family:'DM Sans',sans-serif}button{font:inherit;cursor:pointer}.stage{position:fixed;inset:0;width:100vw;height:100dvh;overflow:hidden;background:#82b99d;touch-action:none}.stage canvas{width:100%;height:100%;display:block}
.hud{position:absolute;z-index:4;top:max(12px,env(safe-area-inset-top));left:14px;display:flex;gap:8px;pointer-events:none}.stat{min-width:76px;padding:8px 11px;border-radius:12px;background:#061c17b8;border:1px solid #ffffff30;backdrop-filter:blur(8px)}.stat span{display:block;color:#c5d8ca;font-size:9px;font-weight:900;letter-spacing:1px;text-transform:uppercase}.stat strong{font:800 24px 'Barlow Condensed';color:#caff38}
.overlay{position:absolute;z-index:6;inset:0;background:linear-gradient(180deg,#041812c9,#061b16a8 45%,#041812e8);display:grid;place-items:center;text-align:center;padding:20px;overflow:auto}.overlay.hidden{display:none}.panel{width:min(540px,100%);padding:24px 20px;border:1px solid #ffffff28;border-radius:24px;background:#08251de0;backdrop-filter:blur(12px);box-shadow:0 20px 80px #0008}.panel h1{font:900 clamp(48px,9vw,86px)/.83 'Barlow Condensed';margin:0 0 14px}.panel em{font-style:normal;color:#caff38}.panel p{font-size:13px;line-height:1.6;color:#d8e7dc;margin:0 auto 18px}.primary{border:0;border-radius:99px;padding:14px 28px;background:#caff38;color:#071b18;font-weight:900;box-shadow:0 5px 0 #789b20}.characters{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:16px 0}.character{display:grid;gap:4px;justify-items:center;min-width:94px;padding:10px 12px;border:1px solid #ffffff38;border-radius:14px;background:#0b3829;color:white}.character.active{border:2px solid #caff38;background:#1a5138}.avatar{font-size:25px}.character b{font-size:11px}.character small{font-size:9px;color:#c2d4c7}.tip{font-size:11px;color:#b7cbbb;margin-top:14px}
@media(max-width:560px){.hud{left:8px;top:max(8px,env(safe-area-inset-top));gap:5px}.stat{min-width:65px;padding:6px 8px}.stat strong{font-size:21px}.panel{padding:20px 14px}.character{min-width:76px;padding:8px}.panel p{font-size:12px}}
</style></head><body><div class="stage" id="stage">
 <div class="hud">
  <div class="stat"><span>Pontos</span><strong id="score">0</strong></div>
  <div class="stat"><span>Moedas</span><strong id="coins">0</strong></div>
  <div class="stat"><span>Sem moedas</span><strong id="streak">0.0s</strong></div>
  <div class="stat"><span>Recorde</span><strong id="best">0</strong></div>
 </div>
 <div class="overlay" id="overlay"><div class="panel">
  <h1>BRASIL<br><em>RUSH 3D</em></h1>
  <p>Corra, desvie, salte e deslize. O asfalto não espera por ninguém.</p>
  <div class="characters">
   <button class="character active" data-char="neymar"><span class="avatar">⚽</span><b>Neymar Jr.</b><small>Camisa 10</small></button>
   <button class="character" data-char="anitta"><span class="avatar">🎤</span><b>Anitta</b><small>Ritmo e atitude</small></button>
   <button class="character" data-char="vini"><span class="avatar">🇧🇷</span><b>Vini Jr.</b><small>Arrancada</small></button>
   <button class="character" data-char="rayssa"><span class="avatar">🛹</span><b>Rayssa</b><small>Skate</small></button>
  </div>
  <button class="primary" id="start">JOGAR AGORA</button>
  <div class="tip">DESLIZE para mudar de pista • PARA CIMA para pular • PARA BAIXO para deslizar</div>
 </div></div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';
const stage=document.querySelector('#stage'),overlay=document.querySelector('#overlay'),$=id=>document.getElementById(id);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8dc9a4);scene.fog=new THREE.Fog(0x8dc9a4,28,90);
const camera=new THREE.PerspectiveCamera(58,1,.1,150);camera.position.set(0,6.6,12.5);camera.lookAt(0,1,-10);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;stage.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe8fff0,0x34523e,2));const sun=new THREE.DirectionalLight(0xfff1cf,3);sun.position.set(-8,15,7);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const material=(c,r=.8,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const M={road:material(0x303b3a),line:material(0xf2e9c9),red:material(0xe85c3d),blue:material(0x3184b7),gold:material(0xffd34d,.3,.5),white:material(0xf4f0df),dark:material(0x15251f),concrete:material(0xc4d1c6)};
const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,150),material(0x5b9c6b));ground.rotation.x=-Math.PI/2;ground.position.set(0,-.16,-35);ground.receiveShadow=true;scene.add(ground);
const road=new THREE.Mesh(new THREE.PlaneGeometry(10,120),M.road);road.rotation.x=-Math.PI/2;road.position.set(0,-.1,-38);road.receiveShadow=true;scene.add(road);
for(const x of [-1.67,1.67]){const l=new THREE.Mesh(new THREE.PlaneGeometry(.075,120),M.line);l.rotation.x=-Math.PI/2;l.position.set(x,-.075,-38);scene.add(l)}
for(const x of [-5.25,5.25]){const c=new THREE.Mesh(new THREE.BoxGeometry(.32,.22,120),material(0xe6d7a9));c.position.set(x,-.02,-38);scene.add(c)}
const scenery=[];for(let i=0;i<34;i++){const side=i%2?1:-1,z=-i*3.8-5,g=new THREE.Group(),h=2.5+(i*17%7)*.55,w=1.3+(i%3)*.45;const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,1.8),material([0x397a62,0xd5a66d,0x557b91,0xb7c5a8][i%4]));b.position.y=h/2-.1;b.castShadow=true;g.add(b);for(let y=.55;y<h-.3;y+=.8)for(let xx=-w/2+.3;xx<w/2-.15;xx+=.55){const win=new THREE.Mesh(new THREE.BoxGeometry(.2,.28,.035),material(0xf6d58b,.3));win.position.set(xx,y,.93);g.add(win)}g.position.set(side*(7.2+(i%3)*.8),0,z);scene.add(g);scenery.push(g);const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.12,.18,1.4,7),material(0x745033));trunk.position.set(side*5.9,.7,z-1.5);scene.add(trunk);const leaves=new THREE.Mesh(new THREE.ConeGeometry(.85,2.1,7),material(0x176b47));leaves.position.set(side*5.9,2.15,z-1.5);scene.add(leaves)}
const player=new THREE.Group();scene.add(player);player.position.z=3.4;let parts=[];
const looks={neymar:[0xe9c928,0x176b42,0x9b6041,0x211711],anitta:[0xe84c91,0x24242b,0xb87956,0x24130f],vini:[0xf0d12a,0x176b42,0x75452f,0x17110e],rayssa:[0xf2f2e9,0x29303a,0xb97854,0x251710]};
let runnerLimbs=[],runnerTorso=null,runnerHead=null;
function makePlayer(name){
 player.traverse(o=>{if(o.isMesh&&o.geometry)o.geometry.dispose()});player.clear();parts=[];runnerLimbs=[];runnerHead=null;runnerTorso=null;
 const [shirtC,shortC,skinC,hairC]=looks[name],shirt=material(shirtC),short=material(shortC),skin=material(skinC),hair=material(hairC),shoe=material(0xf4f0df),accent=material(name==='neymar'?0xf2cf32:name==='anitta'?0xe9a4c7:name==='vini'?0x222222:0xece8df);
 const add=(geo,mat,x,y,z,parent=player)=>{const o=new THREE.Mesh(geo,mat);o.position.set(x,y,z);o.castShadow=true;parent.add(o);parts.push(o);return o};
 const torso=add(new THREE.CapsuleGeometry(.34,.55,5,12),shirt,0,1.25,0);runnerTorso=torso;
 add(new THREE.BoxGeometry(.55,.22,.38),short,0,.79,0);
 runnerHead=add(new THREE.SphereGeometry(.29,20,16),skin,0,1.96,0);
 // Cabelo, rosto e detalhes próprios de cada corredor
 if(name==='neymar'){
  add(new THREE.SphereGeometry(.31,18,12,0,Math.PI*2,0,Math.PI*.55),hair,0,2.08,0);
  add(new THREE.CapsuleGeometry(.105,.24,4,8),accent,0,2.28,-.02);
  add(new THREE.BoxGeometry(.58,.055,.08),accent,0,2.12,.23);
  add(new THREE.TorusGeometry(.12,.025,6,14),material(0xd5a34c),.3,1.42,.02);
 }else if(name==='anitta'){
  add(new THREE.SphereGeometry(.34,18,12,0,Math.PI*2,0,Math.PI*.58),hair,0,2.08,-.02);
  for(const x of [-.29,.29]){const lock=add(new THREE.CapsuleGeometry(.09,.48,5,8),hair,x,1.83,0);lock.rotation.z=x*.45}
  add(new THREE.TorusGeometry(.13,.025,6,16),accent,-.3,1.55,.02);
  add(new THREE.TorusGeometry(.13,.025,6,16),accent,.3,1.55,.02);
  add(new THREE.BoxGeometry(.42,.07,.04),accent,0,1.35,.31);
 }else if(name==='vini'){
  add(new THREE.SphereGeometry(.31,18,12,0,Math.PI*2,0,Math.PI*.53),hair,0,2.1,0);
  for(let i=0;i<7;i++){const curl=add(new THREE.SphereGeometry(.09,8,7),hair,-.24+(i%4)*.16,2.23+Math.floor(i/4)*.07,.04)}
  add(new THREE.TorusGeometry(.3,.045,6,20),accent,0,2.02,0);
  add(new THREE.BoxGeometry(.16,.16,.05),material(0xf1c84b),.19,1.25,.3);
 }else{
  add(new THREE.SphereGeometry(.33,18,12,0,Math.PI*2,0,Math.PI*.55),hair,0,2.08,-.02);
  for(const x of [-.3,.3]){const lock=add(new THREE.CapsuleGeometry(.1,.42,5,8),hair,x,1.82,0);lock.rotation.z=x*.5}
  add(new THREE.SphereGeometry(.36,16,8,0,Math.PI*2,0,Math.PI*.28),accent,0,2.12,0);
  add(new THREE.BoxGeometry(.12,.1,.06),material(0x5cb9e8),.24,1.27,.3);
 }
 // Olhos e sorriso dão expressão ao rosto
 for(const x of [-.105,.105])add(new THREE.SphereGeometry(.035,8,8),material(0x171717),x,1.99,.265);
 add(new THREE.BoxGeometry(.12,.025,.025),material(0x713f37),0,1.86,.27);
 for(const x of [-.16,.16]){
  const leg=new THREE.Group();leg.position.set(x,.7,0);player.add(leg);
  const thigh=add(new THREE.CapsuleGeometry(.105,.37,4,8),skin,0,-.18,0,leg);
  add(new THREE.BoxGeometry(.25,.13,.38),shoe,0,-.55,.08,leg);
  runnerLimbs.push(leg);
  const arm=new THREE.Group();arm.position.set(x*2.65,1.48,0);player.add(arm);
  const upper=add(new THREE.CapsuleGeometry(.09,.42,4,8),skin,0,-.2,0,arm);arm.rotation.z=x<0?-.25:.25;runnerLimbs.push(arm);
 }
}
makePlayer('neymar');
function obstacle(type,lane,z){const g=new THREE.Group();g.position.set((lane-1)*3.15,0,z);g.userData={type,lane,passed:false};if(type==='barrier'){const b=new THREE.Mesh(new THREE.BoxGeometry(2.05,.78,.65),M.red);b.position.y=.42;b.castShadow=true;g.add(b);const s=new THREE.Mesh(new THREE.BoxGeometry(2.08,.13,.67),M.white);s.position.y=.48;g.add(s)}else if(type==='beam'){for(const x of [-.85,.85]){const p=new THREE.Mesh(new THREE.BoxGeometry(.16,2.2,.18),M.blue);p.position.set(x,1.1,0);g.add(p)}const top=new THREE.Mesh(new THREE.BoxGeometry(2,.3,.5),M.gold);top.position.y=2.05;g.add(top)}else{const b=new THREE.Mesh(new THREE.BoxGeometry(2.2,2.3,1.5),M.concrete);b.position.y=1.15;b.castShadow=true;g.add(b);const w=new THREE.Mesh(new THREE.BoxGeometry(1.55,.8,.06),material(0x4b8993));w.position.set(0,1.55,.78);g.add(w)}scene.add(g);return g}
function coin(lane,z){const g=new THREE.Group();g.position.set((lane-1)*3.15,1.35,z);const c=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.13,24),M.gold);c.rotation.x=Math.PI/2;c.castShadow=true;g.add(c);const ring=new THREE.Mesh(new THREE.TorusGeometry(.22,.045,8,20),material(0xfff0a5,.3,.4));ring.position.z=.09;g.add(ring);g.userData={lane,type:'coin',spin:Math.random()*6};scene.add(g);return g}
let objects=[],playing=false,elapsed=0,score=0,coins=0,coinTimer=0,best=Number(localStorage.getItem('br3dBest')||0),lane=1,jump=0,jumpV=0,slide=0,spawn=0,speed=17,last=0,touch=null,laneLean=0,landSquash=0,runBob=0;let selected='neymar';$('best').textContent=best;
function pattern(){const l=Math.floor(Math.random()*3),r=Math.random();if(r<.25){objects.push(coin(l,-58),coin(l,-61),coin(l,-64))}else if(r<.48){objects.push(obstacle('barrier',l,-58));for(let i=0;i<3;i++)objects.push(coin((l+1)%3,-58-i*2.5))}else if(r<.68){objects.push(obstacle('beam',l,-58),coin((l+2)%3,-58))}else if(r<.88){objects.push(obstacle('block',l,-58),coin((l+1)%3,-58))}else{for(let i=0;i<3;i++)objects.push(coin(i,-58-i*2.5))}}
function act(a){if(!playing)return;if(a==='left')lane=Math.max(0,lane-1);if(a==='right')lane=Math.min(2,lane+1);if(a==='jump'&&jump<=.02&&slide<=0)jumpV=10.8;if(a==='slide'){slide=.72;if(jump>.05)jumpV=Math.min(jumpV,-16)}}
function update(dt){if(!playing)return;elapsed+=dt;score+=dt*13;coinTimer+=dt;speed=Math.min(30,17+elapsed*.23);if((spawn-=dt)<=0){pattern();spawn=Math.max(.62,1.18-(speed-17)*.018)}const oldX=player.position.x;const targetX=(lane-1)*3.15;player.position.x+=(targetX-player.position.x)*(1-Math.exp(-dt*8.2));const lateralSpeed=(player.position.x-oldX)/Math.max(dt,.001);laneLean+=(Math.max(-.32,Math.min(.32,-lateralSpeed*.025))-laneLean)*(1-Math.exp(-dt*9));player.rotation.z=laneLean;player.rotation.y+=((laneLean*.22)-player.rotation.y)*(1-Math.exp(-dt*7));camera.position.x+=(player.position.x*.12-camera.position.x)*(1-Math.exp(-dt*2.8));if(jumpV!==0||jump>0){jump+=jumpV*dt;jumpV-=27*dt;if(jump<=0){if(jump>-.08)landSquash=.18;jump=0;jumpV=0}}if(slide>0)slide=Math.max(0,slide-dt);player.position.y=jump;const crouching=slide>0;landSquash=Math.max(0,landSquash-dt*2.2);const desiredScale=1-landSquash;player.scale.y+=(desiredScale-player.scale.y)*(1-Math.exp(-dt*24));player.scale.x+=(1+landSquash*.28-player.scale.x)*(1-Math.exp(-dt*20));player.rotation.x+=((crouching?.72:0)-player.rotation.x)*(1-Math.exp(-dt*(crouching?24:13)));const runPhase=elapsed*(11+speed*.12);runBob=Math.sin(runPhase*2)*.045;player.position.y=jump-(crouching?.13:0)+(jump<.05&&!crouching?runBob:0);if(runnerTorso){runnerTorso.position.y+=( (crouching?.94:1.25)-runnerTorso.position.y)*(1-Math.exp(-dt*25));runnerTorso.rotation.z+=(Math.sin(runPhase)*.025-runnerTorso.rotation.z)*(1-Math.exp(-dt*10));runnerTorso.rotation.x+=((jump>.1?-.16:crouching?.18:0)-runnerTorso.rotation.x)*Math.min(1,dt*16);}if(runnerHead)runnerHead.position.y+=((crouching?1.48:1.96)-runnerHead.position.y)*(1-Math.exp(-dt*25));runnerLimbs.forEach((limb,i)=>{const arm=i%2===1;if(crouching){limb.rotation.x=arm?-1.45:1.05;limb.rotation.z=arm?(i<2?-.25:.25):0;}else if(jump>.1){limb.rotation.x=arm?-.95:.38;limb.rotation.z=0;}else{limb.rotation.x=Math.sin(runPhase+(arm?Math.PI:0))*(arm?.62:.78);limb.rotation.z=0;}});for(const o of objects){o.position.z+=speed*dt;if(o.userData.type==='coin'){o.rotation.y+=dt*3.8;o.position.y=1.35+Math.sin(elapsed*4+o.userData.spin)*.12}if(!o.userData.passed&&o.position.z>2.35&&o.position.z<4.55){if(o.userData.type==='coin'){const dx=o.position.x-player.position.x,dz=o.position.z-player.position.z,dy=o.position.y-(player.position.y+1.15);const hit=(dx/1.3)**2+(dz/.95)**2+(dy/1.15)**2<=1;if(hit){o.userData.passed=true;o.userData.remove=true;coins++;coinTimer=0}}else if(o.userData.lane===lane){o.userData.passed=true;const safe=o.userData.type==='barrier'?jump>.9||slide>0:o.userData.type==='beam'?slide>0:jump>1.15||slide>0;if(!safe){endGame();return}}}if(o.userData.type==='coin'&&!o.userData.passed&&o.position.z>4.55)o.userData.passed=true}objects=objects.filter(o=>{if(o.userData.remove||o.position.z>14){scene.remove(o);return false}return true});for(const s of scenery){s.position.z+=speed*dt*.78;if(s.position.z>12)s.position.z=-112}$('score').textContent=Math.floor(score);$('coins').textContent=coins;$('streak').textContent=coinTimer.toFixed(1)+'s';$('best').textContent=best}
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(stage);resize();
function loop(t){const dt=Math.min((t-last)/1000||0,.04);last=t;update(dt);renderer.render(scene,camera);requestAnimationFrame(loop)}requestAnimationFrame(loop);
function start(){for(const o of objects)scene.remove(o);objects=[];elapsed=score=coins=coinTimer=0;lane=1;jump=jumpV=slide=laneLean=landSquash=0;player.rotation.set(0,0,0);speed=17;spawn=.45;player.position.set(0,0,3.4);player.scale.set(1,1,1);playing=true;overlay.classList.add('hidden')}
function endGame(){playing=false;best=Math.max(best,Math.floor(score));localStorage.setItem('br3dBest',best);$('best').textContent=best;overlay.innerHTML='<div class="panel"><h1>FIM DE<br><em>JOGO!</em></h1><p>Você fez <b>'+Math.floor(score)+' pontos</b>, pegou <b>'+coins+' moedas</b> e ficou <b>'+coinTimer.toFixed(1)+' segundos</b> sem moedas.</p><button class="primary" id="again">CORRER DE NOVO</button></div>';overlay.classList.remove('hidden');$('again').addEventListener('click',start)}
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['a','d','w','s','arrowleft','arrowright','arrowup','arrowdown',' '].includes(k))e.preventDefault();if(k==='a'||k==='arrowleft')act('left');if(k==='d'||k==='arrowright')act('right');if(k==='w'||k==='arrowup'||k===' ')act('jump');if(k==='s'||k==='arrowdown')act('slide');if(k==='enter'&&!playing)start()});
stage.addEventListener('touchstart',e=>{const t=e.changedTouches[0];touch={x:t.clientX,y:t.clientY}},{passive:true});stage.addEventListener('touchend',e=>{if(!touch)return;const t=e.changedTouches[0],dx=t.clientX-touch.x,dy=t.clientY-touch.y;if(Math.max(Math.abs(dx),Math.abs(dy))>22){if(Math.abs(dx)>Math.abs(dy))act(dx>0?'right':'left');else act(dy<0?'jump':'slide')}touch=null},{passive:true});
document.querySelectorAll('[data-char]').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.char;makePlayer(selected);document.querySelectorAll('[data-char]').forEach(x=>x.classList.toggle('active',x===b))}));$('start').addEventListener('click',start);
</script></body></html>
